name: CMake Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure CMake
        run: >
          cmake
          -S "${{ github.workspace }}"
          -B "${{ github.workspace }}/build"
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBUILD_TESTING=ON

      - name: Build
        run: >
          cmake
          --build "${{ github.workspace }}/build"
          --config ${{ env.BUILD_TYPE }}
          --parallel

      - name: Run tests
        run: >
          ctest
          --test-dir "${{ github.workspace }}/build"
          -C ${{ env.BUILD_TYPE }}
          --output-on-failure
